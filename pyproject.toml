[project]
name = "cidrwright"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "pyright==1.1.414"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pyright]
include = ["cidrwright", "tests"]
typeCheckingMode = "standard"   # matches VS Code/Pylance
pythonVersion = "3.10"          # check against the requires-python floor
venvPath = "."
venv = ".venv"